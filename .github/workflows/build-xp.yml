name: Build Windows XP (x86)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build configuration
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  build-xp:
    name: Build XP x86
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          $llvm = Get-ChildItem "`$env:ProgramFiles\LLVM\bin\clang-cl.exe"
          if (-not $llvm) { throw "clang-cl.exe was not installed" }
          "`$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build XP x86
        shell: pwsh
        env:
          CHROME_PLUS_TARGET_XP: "ON"
        run: |
          .\build.cmd x86 ${{ inputs.build_mode }} "version=xp-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-plus-xp-x86-${{ inputs.build_mode }}
          path: out/x86/${{ inputs.build_mode }}/*
          if-no-files-found: error
