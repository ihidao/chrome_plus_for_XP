name: Build Chrome++ for Windows XP

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build configuration
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build x86 (${{ inputs.build_mode }})
    runs-on: windows-2022
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install VC-LTL
        shell: pwsh
        run: nuget install VC-LTL -Version 5.3.1 -NonInteractive -OutputDirectory .

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Configure
        shell: pwsh
        run: xmake f -a x86 -m "${{ inputs.build_mode }}"

      - name: Build
        shell: pwsh
        run: xmake -y

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-plus-xp-x86-${{ inputs.build_mode }}
          path: build/release/version.dll
          if-no-files-found: error
